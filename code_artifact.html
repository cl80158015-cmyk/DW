<!DOCTYPE html>
<html lang="ko" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 논리 게이트 시뮬레이터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#111827', 950: '#020617' },
                        indigo: { 950: '#1e1b4b' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons & Font -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        canvas { touch-action: none; }
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col overflow-hidden select-none">
    <!-- Header -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-5 shadow-lg z-20">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600/20 border border-indigo-500/30 rounded-xl">
                <i data-lucide="cpu" class="w-5 h-5 text-indigo-400"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight bg-gradient-to-r from-indigo-300 via-sky-200 to-indigo-400 bg-clip-text text-transparent">
                    디지털 논리 게이트 시뮬레이터
                </h1>
                <p class="text-[11px] text-slate-400">디지털 회로와 컴퓨터 가산기의 작동 원리 배우기</p>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button id="tabGame" onclick="switchTab('game')" class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-md transition-all flex items-center gap-2">
                <i data-lucide="gamepad-2" class="w-4 h-4"></i> 스테이지 학습
            </button>
            <button id="tabSandbox" onclick="switchTab('sandbox')" class="px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2">
                <i data-lucide="boxes" class="w-4 h-4"></i> 자유 샌드박스
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Palette -->
        <aside class="w-72 bg-slate-900/90 border-r border-slate-800 flex flex-col z-10 backdrop-blur-md">
            <!-- Stage Selector (Game Mode Only) -->
            <div id="stageSelectContainer" class="p-4 border-b border-slate-800/80 bg-slate-950/40">
                <label class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider block mb-2">
                    <i data-lucide="flag" class="w-3.5 h-3.5 inline mr-1"></i> 학습 스테이지 선택 (1~12)
                </label>
                <select id="stageSelect" onchange="loadStage(parseInt(this.value))" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 font-medium cursor-pointer">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <!-- Components Library -->
            <div class="flex-1 overflow-y-auto p-4 space-y-5">
                <!-- IO Components Section -->
                <div>
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i data-lucide="toggle-left" class="w-3.5 h-3.5 text-sky-400"></i> 입출력 부품
                    </h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="addNode('INPUT', 1)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-sky-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>1비트 입력</span>
                        </button>
                        <button onclick="addNode('OUTPUT', 1)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-amber-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>1비트 출력</span>
                        </button>
                        <button onclick="addNode('INPUT', 2)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-sky-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>2비트 입력</span>
                        </button>
                        <button onclick="addNode('OUTPUT', 2)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-amber-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>2비트 출력</span>
                        </button>
                        <button onclick="addNode('INPUT', 3)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-sky-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>3비트 입력</span>
                        </button>
                        <button onclick="addNode('OUTPUT', 3)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-amber-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>3비트 출력</span>
                        </button>
                        <button onclick="addNode('INPUT', 4)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-sky-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>4비트 입력</span>
                        </button>
                        <button onclick="addNode('OUTPUT', 4)" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-amber-500/50 rounded-xl text-xs font-semibold flex items-center justify-center transition-all text-slate-200 shadow-sm active:scale-95">
                            <span>4비트 출력</span>
                        </button>
                    </div>
                </div>

                <!-- Logic Gates Section -->
                <div>
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i data-lucide="cpu" class="w-3.5 h-3.5 text-indigo-400"></i> 논리 게이트
                    </h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="addNode('AND')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">AND</span>
                            <span class="text-[9px] text-slate-400">모두 참일 때 1</span>
                        </button>
                        <button onclick="addNode('OR')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">OR</span>
                            <span class="text-[9px] text-slate-400">하나라도 참이면 1</span>
                        </button>
                        <button onclick="addNode('NOT')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">NOT</span>
                            <span class="text-[9px] text-slate-400">신호 반전</span>
                        </button>
                        <button onclick="addNode('XOR')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">XOR</span>
                            <span class="text-[9px] text-slate-400">서로 다를 때 1</span>
                        </button>
                        <button onclick="addNode('NAND')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">NAND</span>
                            <span class="text-[9px] text-slate-400">AND의 반대</span>
                        </button>
                        <button onclick="addNode('NOR')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">NOR</span>
                            <span class="text-[9px] text-slate-400">OR의 반대</span>
                        </button>
                        <button onclick="addNode('XNOR')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">XNOR</span>
                            <span class="text-[9px] text-slate-400">서로 같을 때 1</span>
                        </button>
                        <button onclick="addNode('BUFFER')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs font-semibold flex flex-col items-center gap-0.5 transition-all text-slate-200 shadow-sm active:scale-95">
                            <span class="font-bold text-indigo-400 text-xs">BUFFER</span>
                            <span class="text-[9px] text-slate-400">신호 유지</span>
                        </button>
                    </div>
                </div>

                <!-- Example Circuits (Sandbox Only) -->
                <div id="sandboxExamples" class="hidden">
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-400"></i> 프리셋 샘플 회로
                    </h3>
                    <div class="space-y-2">
                        <div class="flex items-center gap-1">
                            <button onclick="loadPresetCircuit('halfAdder')" class="flex-1 p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl text-xs font-semibold text-left transition-all text-slate-200">
                                반가산기 (Half Adder)
                            </button>
                            <button onclick="showPresetDescription('halfAdder')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs text-indigo-400 transition-all" title="설명 보기">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="loadPresetCircuit('fullAdder')" class="flex-1 p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl text-xs font-semibold text-left transition-all text-slate-200">
                                전가산기 (Full Adder)
                            </button>
                            <button onclick="showPresetDescription('fullAdder')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs text-indigo-400 transition-all" title="설명 보기">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="loadPresetCircuit('mux')" class="flex-1 p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl text-xs font-semibold text-left transition-all text-slate-200">
                                2대1 멀티플렉서 (MUX)
                            </button>
                            <button onclick="showPresetDescription('mux')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs text-indigo-400 transition-all" title="설명 보기">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="loadPresetCircuit('latch')" class="flex-1 p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl text-xs font-semibold text-left transition-all text-slate-200">
                                SR 래치 (메모리 회로)
                            </button>
                            <button onclick="showPresetDescription('latch')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs text-indigo-400 transition-all" title="설명 보기">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="loadPresetCircuit('majority')" class="flex-1 p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl text-xs font-semibold text-left transition-all text-slate-200">
                                다수결 회로 (Majority)
                            </button>
                            <button onclick="showPresetDescription('majority')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs text-indigo-400 transition-all" title="설명 보기">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="loadPresetCircuit('decoder')" class="flex-1 p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl text-xs font-semibold text-left transition-all text-slate-200">
                                2비트 디코더 (Decoder)
                            </button>
                            <button onclick="showPresetDescription('decoder')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs text-indigo-400 transition-all" title="설명 보기">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="loadPresetCircuit('xorGateChain')" class="flex-1 p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl text-xs font-semibold text-left transition-all text-slate-200">
                                4비트 패리티 체인 (Parity)
                            </button>
                            <button onclick="showPresetDescription('xorGateChain')" class="p-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl text-xs text-indigo-400 transition-all" title="설명 보기">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Canvas Display Area -->
        <main class="flex-1 relative overflow-hidden bg-slate-950 flex flex-col">
            <!-- Canvas Toolbar Top Bar -->
            <div class="h-12 border-b border-slate-800/80 bg-slate-900/60 px-4 flex items-center justify-between z-10 backdrop-blur">
                <div id="gameHeader" class="flex items-center gap-3">
                    <span id="stageTitle" class="text-sm font-bold text-indigo-300 bg-indigo-950/60 border border-indigo-800/60 px-2.5 py-1 rounded-md">
                        [LV 1] 불을 켜라!
                    </span>
                    <span id="stageDesc" class="text-xs text-slate-400 font-medium">
                        스위치를 켜서 출력이 1(ON)이 되도록 전선으로 연결해보세요.
                    </span>
                </div>
                <!-- 샌드박스 모드일 때 빈 공간을 채워주는 flex-1 spacer -->
                <div id="sandboxSpacer" class="hidden flex-1"></div>
                <div class="flex items-center gap-2">
                    <button id="btnHint" onclick="window.showHint()" class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-semibold rounded-lg transition-all shadow-sm active:scale-95">
                        <i data-lucide="lightbulb" class="w-3.5 h-3.5 text-amber-400"></i> 힌트 보기
                    </button>
                    <button id="btnSolution" onclick="applySolution()" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs font-semibold rounded-lg transition-all shadow-sm active:scale-95">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-400"></i> 정답 보기
                    </button>
                    <button onclick="resetCurrentStage()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-rose-950/50 border border-slate-700 hover:border-rose-800 text-slate-300 hover:text-rose-300 text-xs font-semibold rounded-lg transition-all shadow-sm active:scale-95">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 초기화
                    </button>
                </div>
            </div>

            <!-- Main Canvas Box -->
        <div class="flex-1 relative w-full h-full overflow-hidden">
            <!-- Answer Applied Badge -->
            <div id="answerBadge" class="hidden absolute top-4 left-4 z-10 bg-emerald-950/90 border border-emerald-600/80 text-emerald-300 px-3.5 py-2 rounded-xl text-xs font-semibold backdrop-blur shadow-lg flex items-center gap-2 animate-fade-in">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i> 정답 회로가 배치되었습니다! 스위치를 작동해 신호를 확인해보세요.
            </div>

            <!-- Controls Help Badge -->
            <div class="absolute bottom-4 left-4 z-10 bg-slate-900/80 border border-slate-800 text-slate-400 px-3 py-1.5 rounded-lg text-[11px] backdrop-blur flex items-center gap-3">
                <span>🖱️ 우클릭/Space/Ctrl+드래그: 보드 이동</span>
                <span>🔍 휠: 확대/축소</span>
                <span>📋 Ctrl+C/V: 복사/붙여넣기</span>
                <span>⌨️ Del/Backspace: 삭제</span>
            </div>

            <!-- Hint Modal Box -->
            <div id="hintBox" class="hidden absolute top-4 right-4 z-20 bg-slate-900/95 border border-indigo-700/80 text-slate-100 p-4 rounded-xl shadow-2xl max-w-sm backdrop-blur transition-all">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                        <div class="flex items-center gap-1.5 text-indigo-400 font-bold text-xs">
                            <i data-lucide="lightbulb" class="w-4 h-4 text-amber-400"></i> 스테이지 힌트
                        </div>
                        <button onclick="window.hideHint()" class="text-slate-400 hover:text-slate-200 text-xs font-bold px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 transition">✕</button>
                    </div>
                    <p id="hintText" class="text-xs text-slate-300 leading-relaxed">힌트 내용이 표시됩니다.</p>
                </div>

                <canvas id="simCanvas" class="w-full h-full block cursor-crosshair"></canvas>
            </div>
        </main>
    </div>

    <script>
        // --- 전역 변수 및 상태 관리 ---
        let canvas, ctx;
        let currentTab = 'game'; // 'game' | 'sandbox'
        let currentStageIdx = 0;
        let nodes = [];
        let wires = [];
        let isDragging = false;
        let draggedNode = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let connectingPin = null; // { node, type: 'in'|'out', index }
        let selectedNode = null;
        let selectedWire = null;
        let copiedNodeData = null; // 복사된 부품 데이터 저장
        let nodeIdCounter = 1;
        let completedStages = {}; // 클리어된 스테이지 기록 객체 추가

        // View Transform State (Pan & Zoom)
        let panX = 0, panY = 0;
        let zoom = 1;
        let isPanning = false;
        let startPanX = 0, startPanY = 0;
        let spacePressed = false;

        // Mouse Position tracking
        let currentMousePos = { x: 0, y: 0 };
        let worldMousePos = { x: 0, y: 0 };

        // 전역 안전 힌트 제어 함수
        window.hideHint = function() {
            const hintBox = document.getElementById('hintBox');
            if (hintBox) hintBox.classList.add('hidden');
        };

        window.showHint = function() {
            if (typeof stages === 'undefined' || typeof currentStageIdx === 'undefined') return;
            const stg = stages[currentStageIdx];
            const hintBox = document.getElementById('hintBox');
            const hintText = document.getElementById('hintText');
            if (hintBox && hintText && stg) {
                hintText.innerText = stg.hint;
                hintBox.classList.remove('hidden');
                if (window.lucide) lucide.createIcons();
            }
        };

        // --- 12단계 스테이지 데이터 정의 ---
        const stages = [
            {
                id: 1,
                title: "불을 켜라!",
